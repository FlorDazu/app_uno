name: Deploy Angular 22 to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js (Angular 22 requires Node 20+)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Angular app for production with base-href for GitHub Pages
      # Repo: FlorDazu/app_uno → Pages URL: https://FlorDazu.github.io/app_uno/
      # base-href must match the repo name for resources to load correctly
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/app_uno/"

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/app_uno/browser
          keep_files: false
          # force_apt_install: false is default, but being explicit
          force_apt_install: false